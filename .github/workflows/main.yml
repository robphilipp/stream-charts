name: build, test, and publish

# builds and tests both packages (the library and the example app) on every push and pull request
# to master; publishes the library to npm when a push to master carries a version that isn't
# published yet
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: use node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # builds the library (its dist, which is what's published), then the example app
      - run: npm run build
      - run: npm run lint
      - run: npm test

      - name: check whether this version of the library is already published
        id: version
        if: github.event_name == 'push'
        run: |
          VERSION=$(node -p "require('./packages/stream-charts/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "stream-charts@$VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # pre-release versions (e.g. 2.0.0-snapshot) go out under the "next" tag, so that they
      # don't become what `npm install stream-charts` installs
      - name: publish the library
        if: github.event_name == 'push' && steps.version.outputs.published == 'false'
        run: |
          case "${{ steps.version.outputs.version }}" in
            *-*) npm publish -w stream-charts --tag next ;;
            *)   npm publish -w stream-charts ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
